<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f5c5c">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-192.png">
<title>Kas Saku – Money Tracker</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div class="wrap">
  <header>
    <small>Final balance</small>
    <div class="bal" id="final">Rp0</div>
    <div class="stats">
      <div class="stat"><small>Total money in</small><b id="tin">Rp0</b></div>
      <div class="stat"><small>Total spent</small><b id="tout">Rp0</b></div>
    </div>
  </header>

  <div class="grid">
    <section class="panel" aria-labelledby="h-new">
      <h2 id="h-new">New transaction</h2>
      <div class="seg" role="group" aria-label="Transaction type">
        <button type="button" class="out" id="t-out" aria-pressed="true">Spend</button>
        <button type="button" class="in" id="t-in" aria-pressed="false">Add funds</button>
      </div>
      <label for="amount">Amount (Rp)</label>
      <input id="amount" inputmode="numeric" autocomplete="off" placeholder="e.g. 25.000">
      <label for="reason" id="reason-l">Reason for spending</label>
      <input id="reason" maxlength="80" autocomplete="off" placeholder="e.g. Lunch, bus fare, textbook">
      <div class="calc" aria-live="polite">
        <div>Current balance<b id="c-cur">Rp0</b></div><span class="arrow" id="c-sign">−</span><div>Final balance<b id="c-fin">Rp0</b></div>
      </div>
      <p class="err" id="err" role="alert"></p>
      <button class="btn" id="save" type="button">Save transaction</button>
      <details>
        <summary>Starting balance and reset</summary>
        <label for="start">Starting balance (Rp)</label>
        <div class="row2"><input id="start" inputmode="numeric" placeholder="0"><button class="btn" id="setstart" type="button">Set</button></div>
        <div class="row2"><button class="btn ghost" id="reset" type="button">Erase all history</button></div>
              </details>
    </section>

    <section class="panel" aria-labelledby="h-hist">
      <h2 id="h-hist">Transaction history</h2>
      <ul id="list"></ul>
    </section>
  </div>

  <section class="panel report" aria-labelledby="h-rep">
    <h2 id="h-rep">Income and expense reports</h2>
    <div class="ptabs" role="group" aria-label="Report period">
      <button type="button" class="ptab" data-p="day">Daily</button>
      <button type="button" class="ptab" data-p="week">Weekly</button>
      <button type="button" class="ptab" data-p="month">Monthly</button>
      <button type="button" class="ptab" data-p="year">Yearly</button>
    </div>
    <div class="pnav">
      <button type="button" id="prev" aria-label="Previous period">&lsaquo;</button>
      <b id="plabel"></b>
      <button type="button" id="next" aria-label="Next period">&rsaquo;</button>
    </div>
    <div class="sum3">
      <div class="sbox in"><small>Income</small><b id="r-in">Rp0</b></div>
      <div class="sbox out"><small>Spent</small><b id="r-out">Rp0</b></div>
      <div class="sbox"><small>Net</small><b id="r-net">Rp0</b></div>
    </div>
    <h3>Income vs spending</h3>
    <div class="legend"><span class="li-in">Income</span><span class="li-out">Spent</span></div>
    <div class="chart" id="chart" role="img" aria-label="Bar chart of income and spending for the selected period"></div>
    <h3>Highest expenses</h3>
    <ol class="top" id="top"></ol>
  </section>
</div>

<div id="toasts" role="status" aria-live="polite"></div>
<dialog id="dlg">
  <h3 id="dlg-t"></h3><p id="dlg-m"></p>
  <div class="row2"><button class="btn" id="dlg-no" type="button">Cancel</button><button class="btn ghost" id="dlg-yes" type="button">Confirm</button></div>
</dialog>

<script src="script.js"></script>
</body>
</html>
